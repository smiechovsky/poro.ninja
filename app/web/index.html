<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poro Ninja - League of Legends Mastery Tracker</title>
    <link rel="stylesheet" href="/app/web/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Poro Ninja</h1>
            <div class="subtitle">League of Legends Mastery Tracker</div>
        </div>

        <form method="GET" action="/" class="search-container">
            <!-- Nickname input with autocomplete -->
            <div class="search-field">
                <input type="text" id="nickname" name="nickname" placeholder="Enter nickname" required autocomplete="off" autofocus="false">
                <div id="nickname-suggestions" class="suggestions"></div>
            </div>

            <!-- Tag input -->
            <div class="search-field">
                <input type="text" id="tag" name="tag" placeholder="#TAG" required>
            </div>

            <!-- Region dropdown -->
            <div class="search-field">
                <select id="region" name="region" required>
                    <option value="br1">BR</option>
                    <option value="euw1">EUW</option>
                    <option value="eun1">EUNE</option>
                    <option value="jp1">JP</option>
                    <option value="kr">KR</option>
                    <option value="la1">LAN</option>
                    <option value="la2">LAS</option>
                    <option value="na1">NA</option>
                    <option value="oc1">OCE</option>
                    <option value="ru">RU</option>
                    <option value="tr1">TR</option>
                    <option value="ph2">PH</option>
                    <option value="sg2">SG</option>
                    <option value="th2">TH</option>
                    <option value="tw2">TW</option>
                    <option value="vn2">VN</option>
                </select>
            </div>

            <!-- Search button -->
            <button type="submit">Search</button>
        </form>
    </div>

        <script>
        document.addEventListener("DOMContentLoaded", function() {
            const nicknameInput = document.getElementById("nickname");
            const tagInput = document.getElementById("tag");
            const regionSelect = document.getElementById("region");
            const nicknameSuggestionsBox = document.getElementById("nickname-suggestions");
            
            // Hide suggestions box initially
            nicknameSuggestionsBox.style.display = "none";

            // Autocomplete for nickname only (after 3 characters)
            nicknameInput.addEventListener("input", function() {
                const query = nicknameInput.value.trim();
                if (query.length < 3) {
                    nicknameSuggestionsBox.style.display = "none";
                    return;
                }

                fetch(`/search?query=${encodeURIComponent(query)}`)
                    .then(r => r.json())
                    .then(list => {
                        nicknameSuggestionsBox.innerHTML = "";
                        list.forEach(item => {
                            const d = document.createElement('div');
                            d.innerHTML = `
                                <div style="font-weight: 600;">${item.nickname}</div>
                                <div style="font-weight: 600; color: #4a90e2;">${item.tag}</div>
                                <div style="font-size: 12px; color: #888;">${item.region}</div>
                            `;
                            d.addEventListener('click', () => {
                                nicknameInput.value = item.nickname;
                                tagInput.value = item.tag;
                                regionSelect.value = item.regionCode;
                                nicknameSuggestionsBox.style.display = 'none';
                            });
                            nicknameSuggestionsBox.appendChild(d);
                        });
                        nicknameSuggestionsBox.style.display = list.length ? 'block' : 'none';
                    })
                    .catch(console.error);
                });

            // Hide suggestions when clicking outside
            document.addEventListener('click', e => {
                if (!nicknameSuggestionsBox.contains(e.target) && e.target !== nicknameInput) {
                    nicknameSuggestionsBox.style.display = 'none';
                }
            });
        });
    </script>
    </body>
</html>
