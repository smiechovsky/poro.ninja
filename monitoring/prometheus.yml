global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL Exporter - Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Mastery API Service
  - job_name: 'mastery-api'
    static_configs:
      - targets: ['mastery-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Mastery Worker Service
  - job_name: 'mastery-worker'
    static_configs:
      - targets: ['mastery-worker:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Accounts Finder Service
  - job_name: 'accounts-finder'
    static_configs:
      - targets: ['accounts-finder:3002']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Load Balancer (Nginx)
  - job_name: 'load-balancer'
    static_configs:
      - targets: ['load-balancer:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s 

  # Volume Metrics Exporter - Docker volume sizes
  - job_name: 'volume-metrics-exporter'
    static_configs:
      - targets: ['volume-metrics-exporter:9106']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # API Metrics Exporter - Combined API and account sync metrics
  - job_name: 'api-metrics-exporter'
    static_configs:
      - targets: ['api-metrics-exporter:9107']
    scrape_interval: 5s
    metrics_path: '/metrics' 